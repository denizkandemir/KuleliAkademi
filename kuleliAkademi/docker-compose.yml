services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kuleli_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mysql_test
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kuleliakademi
      DB_USERNAME: root
      DB_PASSWORD: root

  mysql:
    image: mysql:8.0
    container_name: kuleli_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: kuleliakademi
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  # Disposable database used ONLY by scripts/test-safe.ps1 / phpunit. Never
  # holds real data — safe to wipe, migrate:fresh, or recreate at any time.
  mysql_test:
    image: mysql:8.0
    container_name: kuleli_mysql_test
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: kuleliakademi_test
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_test_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kuleli_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql      

volumes:
  mysql_data:
  mysql_test_data: